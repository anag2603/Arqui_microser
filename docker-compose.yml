services:
  postgres:
    image: postgres:16
    container_name: tienda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: tienda-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: tienda-auth
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      USER_SERVICE_URL: http://user-service:${USER_PORT}
    ports:
      - '${AUTH_PORT}:${AUTH_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: tienda-user
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '${USER_PORT}:${USER_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tienda-gateway
    env_file: .env
    environment:
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:${AUTH_PORT}
      USER_SERVICE_URL: http://user-service:${USER_PORT}
    ports:
      - '${GATEWAY_PORT}:${GATEWAY_PORT}'
    depends_on:
      - auth-service
      - user-service
      - redis

volumes:
  postgres_data:
  redis_data:
